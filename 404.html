<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="origin">
<meta name="robots" content="noindex">
<title>LunaRise has moved</title>
<link rel="canonical" href="https://lunarise-app.github.io/">
<link rel="icon" href="favicon.ico">
<noscript><meta http-equiv="refresh" content="0;url=https://lunarise-app.github.io/"></noscript>
<style>
html,body{margin:0;height:100%;background:#0d0b1f;color:#eef;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
img{width:72px;height:72px;border-radius:18px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 8px}p{margin:0 0 20px;color:#b9b6d9}
a{display:inline-block;padding:12px 22px;border-radius:12px;background:#7c5cff;color:#fff;text-decoration:none;font-weight:600}
</style>
<script>
(function () {
  var NEW = 'https://lunarise-app.github.io';
  var hash = '';
  try {
    var d = {}, total = 0, skip = { lr_move_done: 1 };
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i); if (!k || skip[k] || k.length >= 80) continue;
      var v = localStorage.getItem(k); if (v == null || v.length > 400000) continue;
      if (total + v.length > 1200000) continue;
      d[k] = v; total += v.length;
    }
    if (Object.keys(d).length) {
      var b = btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      hash = '#lrmove=' + b;
    }
  } catch (e) { hash = ''; }
  var path = location.pathname || '/';
  if (/^\/LunaRise(\/|$)/i.test(path)) path = path.replace(/^\/LunaRise/i, '') || '/';
  location.replace(NEW + path + location.search + hash);
})();
</script>
</head>
<body>
<main>
<img src="icon-192.png" alt="">
<h1>LunaRise has a new address</h1>
<p>lunarise-app.github.io</p>
<a href="https://lunarise-app.github.io/">Open LunaRise</a>
</main>
</body>
</html>
